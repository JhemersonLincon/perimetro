services:
  db:
    image: postgres:16-alpine
    container_name: cronica_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cronica_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cronica_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-cronica_rpg}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cronica_user} -d ${POSTGRES_DB:-cronica_rpg}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cronica_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cronica_user}:${POSTGRES_PASSWORD:-cronica_secret_pass}@db:5432/${POSTGRES_DB:-cronica_rpg}
      SECRET_KEY: ${SECRET_KEY:-cronica_super_secret_jwt_key_change_in_production_2026}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cronica_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
